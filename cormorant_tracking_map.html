                color: '#ffffff',
                weight: 2.5,
                fillOpacity: 0.9
            }).bindPopup(`
                <div class="custom-popup">
                    <h4 style="color:${poi.color};">${poi.name}</h4>
                    <p><b>좌표</b>: ${poi.lat.toFixed(5)}, ${poi.lon.toFixed(5)}<br>${poi.desc}</p>
                </div>
            `).addTo(poiGroup);
        });
        poiGroup.addTo(map);
        overlayMaps["주요 핵심 서식/방사지점 (POI)"] = poiGroup;

        // Add Layer Control
        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

        // Populate Dashboard Legend
        const legendDiv = document.getElementById('birdLegend');
        for (const [bird, meta] of Object.entries(birdMeta)) {
            const item = document.createElement('div');
            item.className = 'bird-item';
            item.innerHTML = `
                <div class="bird-left">
                    <span class="color-box" style="background:${birdColors[bird]}"></span>
                    <b>${bird}</b>
                </div>
                <div>
                    <span class="stats-badge">${meta.dist} km / ${meta.days}일</span>
                </div>
            `;
            item.onclick = () => {
                if (map.hasLayer(birdLayers[bird])) {
                    map.removeLayer(birdLayers[bird]);
                    item.style.opacity = '0.4';
                } else {
                    map.addLayer(birdLayers[bird]);
                    item.style.opacity = '1.0';
                }
            };
            legendDiv.appendChild(item);
        }
    </script>
</body>
</html>
